[package]
name = "ctx-core"
version = "0.1.0"
edition = "2024"
repository.workspace = true

[dependencies]
anyhow = "1.0.94"
clap = { version = "4.5.53", features = ["derive"] }
config = "0.15.19"
shellexpand = "3.1.0"
dirs = "5.0.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "macros", "sqlite"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "1.0.69"
toml = "0.8.19"
sysinfo = "0.30.13"
time = { version = "0.3.37", features = ["formatting", "parsing", "serde", "serde-well-known", "macros"] }
uuid = { version = "1.11.0", features = ["v4"] }
arboard = "3.4.1"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
x-win = "5.3.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
xcap = { version = "0.9.8", default-features = false }

[dev-dependencies]
tempfile = "3.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2.0"
macos-accessibility-client = "0.0.2"
