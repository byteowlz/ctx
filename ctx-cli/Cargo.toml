[package]
name = "ctx-cli"
version = "0.1.0"
edition = "2024"
repository.workspace = true

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.94"
clap = { version = "4.5.53", features = ["derive"] }
ctx-core = { path = "../ctx-core" }
dialoguer = "0.11"
serde_json = "1.0.132"
tempfile = "3.14.0"
time = { version = "0.3.37", features = ["formatting", "macros"] }
