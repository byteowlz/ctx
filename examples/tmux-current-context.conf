# Example tmux hooks for reporting focused tmux context to ctx.
#
# Usage:
#   cat examples/tmux-current-context.conf >> ~/.tmux.conf
#   tmux source-file ~/.tmux.conf
#
# Verify the mirrored state with:
#   ctx current --json
#
# ctx does not automatically poll tmux. These hooks announce a complete active
# terminal context whenever tmux focus changes. Because reports replace the
# active context wholesale, non-terminal reporters such as AeroSpace should omit
# cwd/project unless the focused surface is explicitly a terminal context.

set-hook -g client-session-changed 'run-shell "ctx current report --source tmux --kind terminal --cwd \"#{pane_current_path}\" --project \"#{session_name}\" --window \"#{window_name}\""'
set-hook -g window-focus-in 'run-shell "ctx current report --source tmux --kind terminal --cwd \"#{pane_current_path}\" --project \"#{session_name}\" --window \"#{window_name}\""'
set-hook -g pane-focus-in 'run-shell "ctx current report --source tmux --kind terminal --cwd \"#{pane_current_path}\" --project \"#{session_name}\" --window \"#{window_name}\""'
