# Example tmux hooks for reporting focused tmux context to ctx.
#
# Usage:
#   cat examples/tmux-current-context.conf >> ~/.tmux.conf
#   tmux source-file ~/.tmux.conf
#
# Verify the mirrored state with:
#   ctx current --json
#
# ctx does not automatically poll tmux. These hooks announce a complete active
# terminal context whenever tmux focus changes. Because reports replace the
# active context wholesale, non-terminal reporters such as AeroSpace should omit
# cwd/project unless the focused surface is explicitly a terminal context.
#
# Nested multiplexers: when the focused pane itself runs another multiplexer
# (herdr, zellij, nested tmux), these hooks skip reporting and let the inner
# reporter (examples/herdr-current-context.sh, examples/zellij-current-context.sh)
# own the state. Reports also carry --depth 1 so ctx can drop stale outer
# reports racing with fresher, deeper ones on the same focus change.

set-hook -g client-session-changed 'run-shell "case \"#{pane_current_command}\" in herdr|zellij|tmux) ;; *) ctx current report --source tmux --kind terminal --depth 1 --cwd \"#{pane_current_path}\" --project \"#{session_name}\" --window \"#{window_name}\";; esac"'
set-hook -g window-focus-in 'run-shell "case \"#{pane_current_command}\" in herdr|zellij|tmux) ;; *) ctx current report --source tmux --kind terminal --depth 1 --cwd \"#{pane_current_path}\" --project \"#{session_name}\" --window \"#{window_name}\";; esac"'
set-hook -g pane-focus-in 'run-shell "case \"#{pane_current_command}\" in herdr|zellij|tmux) ;; *) ctx current report --source tmux --kind terminal --depth 1 --cwd \"#{pane_current_path}\" --project \"#{session_name}\" --window \"#{window_name}\";; esac"'
